
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nepal_travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_provinces &&
             gunicorn main.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@db:5432/nepal_travel
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A main worker -l info
    env_file: .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@db:5432/nepal_travel
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A main beat -l info
    env_file: .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@db:5432/nepal_travel
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
